# ============================================================
#  tmux 配置 —— 面向 Claude Code 开发优化
# ============================================================

# ---- 基础 ----
set -g set-titles on            # 终端窗口标题随 tmux 更新
set -g set-titles-string '#{pane_title} · #S:#I:#W'   # cc 当前任务 + tmux 默认信息(会话:窗口:进程)
set -g mouse on                 # 鼠标滚动 / 选择 / 切换窗格
set -g history-limit 50000      # 加大回滚缓冲，cc 长输出可向上翻

# ---- Claude Code 关键：扩展按键 & 转义序列穿透 ----
# Shift+Enter 换行、完成通知、进度条均依赖以下三项
set -g allow-passthrough on               # 让 cc 的 OSC 通知等序列穿过 tmux
set -s extended-keys on                    # 转发 CSI-u 扩展按键（Shift+Enter 等）
set -as terminal-features 'xterm*:extkeys'

# ---- 真彩色（语法高亮 / diff 配色更准）----
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB'

# ---- 开发体验 ----
set -s escape-time 10           # ESC 近零延迟，cc/vim 退出模式更跟手
set -g focus-events on          # 把终端焦点事件透传给应用
